# Render Blueprint — deploy the LoanLens backend from this repo.
# In Render: New → Blueprint → select this repo, or create the Web Service
# manually with the same settings.
services:
  # Deployed manually (not via this Blueprint) under the name "LoanLensAI" —
  # live at https://loanlensai.onrender.com. Kept here for reference/re-deploy;
  # if you ever redeploy this service from scratch via Blueprint, name it to
  # match so the URL stays the same.
  - type: web
    name: LoanLensAI
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false # paste in dashboard
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false # optional — only read when EXTRACTION_PROVIDER=groq
      - key: EXTRACTION_PROVIDER
        value: anthropic # set to "groq" to run document extraction on Groq's free tier instead
      # RAG assistant: Ollama Cloud for chat and Chroma Cloud for embeddings/vector search.
      # Set API keys and account-specific Chroma tenant/database values in Render.
      - key: CHAT_PROVIDER
        value: ollama
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_CHAT_MODEL
        value: gemma4:31b
      - key: EMBEDDING_PROVIDER
        value: chroma-cloud
      - key: CHROMA_BASE_URL
        value: https://api.trychroma.com
      - key: CHROMA_EMBEDDING_URL
        value: https://embed.trychroma.com/embed
      - key: CHROMA_EMBEDDING_MODEL
        value: Qwen/Qwen3-Embedding-0.6B
      - key: CHROMA_EMBEDDING_TIMEOUT_MS
        value: "120000"
      - key: CHROMA_API_KEY
        sync: false
      - key: CHROMA_TENANT
        sync: false
      - key: CHROMA_DATABASE
        sync: false
      - key: CHROMA_COLLECTION
        value: loan-knowledge-qwen
      - key: STORAGE_PROVIDER
        value: mongo # set to "r2" to store uploaded files in the private Cloudflare R2 bucket
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SETUP_SECRET
        generateValue: true

  - type: web
    name: loanlens-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npx expo export --platform web
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        sync: false # set to the backend service URL, e.g. https://loanlensai.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
